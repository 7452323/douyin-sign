name: Sync Constants

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run constants update
        run: python update.py

      - name: Check for changes
        id: check_changes
        run: |
          # Only real constant moves count: apk_version.txt / last-check.json
          # change every run and must not open a PR.
          if [ -n "$(git status --porcelain constants/current/sign_key.b64 constants/current/gorgon_table.hex)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Constants have changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to constants."
          fi

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update constants from latest TikTok APK"
          title: "chore: update constants from latest TikTok APK"
          body: |
            This PR updates the signature constants (`sign_key.b64`, `gorgon_table.hex`) 
            extracted from the latest TikTok APK.

            - Auto-generated by the `sync.yml` workflow
            - Triggered by daily cron or push to master
            - Please review the changes before merging
          branch: auto/update-constants
          base: master
          delete-branch: true
